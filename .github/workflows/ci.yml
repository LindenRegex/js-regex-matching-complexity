name: Docker CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - 'rocq/rocq-prover:9.1.1'
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: coq-community/docker-coq-action@v1
        with:
          custom_image: ${{ matrix.image }}
          custom_script: |
            startGroup "Build"
              sudo chown -R "$(id -u):$(id -g)" .
              opam pin remove -y dune || true
              opam install -y --confirm-level=unsafe-yes 'dune>=3.23'
              dune build
            endGroup
